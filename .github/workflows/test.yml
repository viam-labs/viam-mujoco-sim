on:
  push:

jobs:
  test:
    # Pinned: newer Ubuntu drops libosmesa6 because Mesa removed OSMesa.
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq libosmesa6
    - run: make lint
    - run: make test
