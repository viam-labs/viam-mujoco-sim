# Publishes a registry version for every pushed tag, e.g. `git tag 0.1.0 && git push origin 0.1.0`.
# The tag is the version, so use plain semver with no leading "v".
# See https://github.com/viamrobotics/build-action
on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: viamrobotics/build-action@v1
        with:
          version: ${{ github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
